name: Breadboard QEMU binaries

on:
  pull_request:
    paths:
      - meson.build
      - meson_options.txt
      - scripts/breadboard-*
      - system/breadboard-main.c
      - .github/workflows/breadboard-build.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Existing, reviewed QEMU source tag to package (for example bb-qemu-11.1.3-1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-softmmu
            runner: ubuntu-24.04
            profile: x86_64
          - arch: aarch64
            target: aarch64-softmmu
            runner: ubuntu-24.04-arm
            profile: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      - name: Install QEMU build dependencies
        run: |
          sudo apt-get update
          # QEMU's mkvenv bootstraps from vendored wheels; python3-venv provides ensurepip.
          sudo apt-get install -y clang llvm lld ninja-build python3-venv \
            patchelf pkg-config libglib2.0-dev libpixman-1-dev zlib1g-dev libfdt-dev \
            liburing-dev libusb-1.0-0-dev libnuma-dev
      - name: Configure Breadboard device profile
        run: |
          mkdir build
          cd build
          CC=clang CXX=clang++ ../scripts/breadboard-configure --prefix=/bb --libdir=lib \
            --disable-modules -Db_staticpic=true -Dbreadboard_runtime_library=true
      - name: Build and test
        run: |
          ninja -C build -j"$(nproc)"
          build/pyvenv/bin/meson test -C build --print-errorlogs
      - name: Package QEMU and runtime dependency manifest
        env:
          BB_QEMU_TAG: ${{ inputs.tag }}
          BB_QEMU_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/breadboard-qemu"
          DESTDIR="$RUNNER_TEMP/install" build/pyvenv/bin/meson install -C build --no-rebuild
          scripts/breadboard-stage-runtime "$RUNNER_TEMP/install/bb" "$stage"
          git rev-parse HEAD > "$stage/share/source-commit"
          printf '%s\n' "$BB_QEMU_TAG" > "$stage/share/source-tag"
          build/pyvenv/bin/meson configure build > "$stage/share/build-options.txt"
          ldd "$stage/bin/qemu-system-${BB_QEMU_ARCH}" > "$stage/share/runtime-libraries.txt"
          ldd "$stage/bin/qemu-img" >> "$stage/share/runtime-libraries.txt"
          tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 --numeric-owner \
            -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/breadboard-qemu-${BB_QEMU_ARCH}.tar.gz" breadboard-qemu
          sha256sum "$RUNNER_TEMP/breadboard-qemu-${BB_QEMU_ARCH}.tar.gz" \
            > "$RUNNER_TEMP/breadboard-qemu-${BB_QEMU_ARCH}.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: breadboard-qemu-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/breadboard-qemu-${{ matrix.arch }}.tar.gz
            ${{ runner.temp }}/breadboard-qemu-${{ matrix.arch }}.tar.gz.sha256

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: breadboard-qemu-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          fail_on_unmatched_files: true
          files: dist/*
