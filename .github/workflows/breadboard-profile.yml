name: Breadboard KVM profile

on:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: breadboard-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    if: github.server_url != 'https://github.com'
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        cc: [gcc, clang]
        include:
          - arch: x86_64
            runner: x64
          - arch: aarch64
            runner: arm64
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Arch Linux build dependencies on BB runners
        run: |
          test -f /etc/arch-release
          test "$(uname -m)" = "${{ matrix.arch }}"
          root=()
          if (( EUID != 0 )); then root=(sudo); fi
          "${root[@]}" pacman -Syu --needed --noconfirm base-devel gcc clang ninja python pkgconf \
            linux-api-headers glib2 pixman zlib dtc liburing libusb numactl libseccomp zstd
          # BB images can retain package records after pruning pkg-config files.
          for pair in libpcre2-8:pcre2 libusb-1.0:libusb libzstd:zstd libseccomp:libseccomp; do
            if ! pkg-config --exists "${pair%:*}"; then
              "${root[@]}" pacman -S --noconfirm "${pair#*:}"
            fi
          done
      - name: Configure native Breadboard device profile
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          "$CC" --version
          "$CXX" --version
          mkdir build
          cd build
          # Exercise the defaults used by BB's pinned-fork build, not explicit
          # --disable flags that could conceal a regression in those defaults.
          ../configure \
            --target-list=${{ matrix.arch }}-softmmu \
            --without-default-devices --with-devices-${{ matrix.arch }}=breadboard \
            --enable-seccomp --enable-zstd --enable-kvm --enable-linux-io-uring --enable-libusb --enable-numa \
            --disable-linux-aio --disable-nitro --disable-slirp \
            --disable-curl --disable-libiscsi --disable-libnfs --disable-libssh \
            --disable-rbd \
            --enable-vhost-kernel --enable-vhost-user --enable-tools \
            --disable-guest-agent --disable-vhost-user-blk-server \
            --disable-replication --disable-colo-proxy --disable-l2tpv3 \
            --audio-drv-list= \
            --disable-alsa --disable-coreaudio --disable-jack --disable-oss \
            --disable-pa --disable-pipewire --disable-sndio \
            --disable-curses --disable-dbus-display --disable-gtk \
            --disable-opengl --disable-png --disable-qemu-vnc \
            --disable-rutabaga-gfx --disable-sdl --disable-sdl-image \
            --disable-spice --disable-spice-protocol --disable-vnc \
            --disable-vnc-jpeg --disable-vnc-sasl --disable-virglrenderer \
            --disable-vte \
            --disable-docs --disable-werror \
            --disable-modules
      - name: Build and verify devices, dependencies, and disk tools
        run: |
          ninja -C build -j"$(nproc)" qemu-system-${{ matrix.arch }} qemu-img \
            tests/unit/test-crypto-hash tests/unit/test-vfio-pci-reset
          build/tests/unit/test-vfio-pci-reset
          python3 tests/breadboard/check-build.py build ${{ matrix.arch }}
      - name: Verify firmware and descriptor install manifests
        run: |
          export PATH="$PWD/build/pyvenv/bin:$PATH"
          python3 tests/breadboard/test-firmware.py
