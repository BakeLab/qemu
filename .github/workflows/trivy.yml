name: Dependency vulnerability scan
on:
  push:
    branches: [trim]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Generate dependency SBOM and scan for known vulnerabilities
        run: bash scripts/ci/trivy-dependencies.sh
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: dependency-audit
          path: ${{ runner.temp }}/dependency-audit/
          retention-days: 7
